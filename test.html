<!DOCTYPE html><html lang="ko">
<head>
<meta charset="UTF-8" />
<title>롤 내전 팀 빌더</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Pretendard',sans-serif;margin:0;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e5e7eb}h1{text-align:center;padding:25px;margin:0;font-weight:600}

.wrapper{display:flex;justify-content:center;gap:40px;padding:20px 40px 40px}

.card{background:#111827;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.4);padding:20px}

.player-card{width:260px}

.player-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;margin-bottom:4px;background:#1f2937;font-size:14px}

.player-row.used{opacity:0.35;text-decoration:line-through}

.score-input{width:45px;background:#111827;border:1px solid #374151;color:white;border-radius:6px;text-align:center}

.score-input:focus{outline:none;background:#374151}

.table-card{min-width:620px}

table{border-collapse:collapse;font-size:14px;width:100%}

th{background:#2563eb;padding:10px}

td{padding:6px;background:#0f172a}

th,td{border:1px solid #1f2937;text-align:center}

.team-name{background:#1d4ed8;font-weight:600}

input{width:85px;padding:6px;border-radius:6px;border:none;background:#1f2937;color:white;text-align:center}

input:focus{outline:none;background:#374151}

.team-score{font-size:12px;color:#93c5fd}

.footer{text-align:center;padding:10px;font-size:12px;opacity:0.5} </style>

</head>
<body><h1>🎮 롤 내전 팀 빌더</h1><div class="wrapper"><div class="card player-card">
<h3>선수 & 실력</h3>
<div id="players"></div>
</div><div class="card table-card">
<table>
<thead>
<tr>
<th>팀</th>
<th>탑</th>
<th>정글</th>
<th>미드</th>
<th>원딜</th>
<th>서폿</th>
<th>합계</th>
</tr>
</thead>
<tbody id="teamTable"></tbody>
</table>
</div></div><div class="footer">왼쪽에서 실력 점수 수정 가능 / 팀 합계 자동 계산</div><script>
const players=[
"선종","정현","성훈","민우","영훈",
"재형","형곤","승환","봉섭","은우",
"상무","동규","태형","야곱","희용",
"승종","태규","태현","동훈","욱기",
"동원","용주","재광","성균","문규"
];

const scores={};
players.forEach(p=>scores[p]=3.0);

const playerDiv=document.getElementById("players");

function renderPlayers(){
playerDiv.innerHTML="";

players.forEach(p=>{
const row=document.createElement("div");
row.className="player-row";
row.id="player_"+p;

row.innerHTML=`
<span>${p}</span>
<input class="score-input" value="${scores[p]}" step="0.1" type="number" onchange="updateScore('${p}',this.value)">
`;

playerDiv.appendChild(row);
});
}

function updateScore(player,val){
scores[player]=parseFloat(val)||0;
updateUsage();
}

function updateUsage(){

players.forEach(p=>{
const el=document.getElementById("player_"+p);
if(el) el.classList.remove("used");
});

const inputs=document.querySelectorAll(".player-input");

inputs.forEach(i=>{
const name=i.value.trim();
if(players.includes(name)){
const el=document.getElementById("player_"+name);
if(el) el.classList.add("used");
}
});

updateTeamScores();
}

function updateTeamScores(){

const rows=document.querySelectorAll(".team-row");

rows.forEach(row=>{

let total=0;

row.querySelectorAll(".player-input").forEach(i=>{
const name=i.value.trim();
if(scores[name]) total+=scores[name];
});

row.querySelector(".team-score").innerText=total.toFixed(1);

});

}

const tbody=document.getElementById("teamTable");

for(let i=1;i<=5;i++){

const tr=document.createElement("tr");
tr.className="team-row";

tr.innerHTML=`
<td class="team-name">팀 ${i}</td>
<td><input class="player-input" oninput="updateUsage()"></td>
<td><input class="player-input" oninput="updateUsage()"></td>
<td><input class="player-input" oninput="updateUsage()"></td>
<td><input class="player-input" oninput="updateUsage()"></td>
<td><input class="player-input" oninput="updateUsage()"></td>
<td class="team-score">0</td>
`;


tbody.appendChild(tr);
}

renderPlayers();
</script></body>
</html>
